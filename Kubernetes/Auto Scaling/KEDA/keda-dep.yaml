apiVersion: v1
kind: Service
metadata:
  name: http-app
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: http-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-app
  template:
    metadata:
      labels:
        app: http-app
    spec:
      containers:
        - name: http-app
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
